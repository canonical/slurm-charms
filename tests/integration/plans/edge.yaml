---
feature: "Slurm cluster deployment"
type: functional
status: implemented
risk: edge
description: |-
  Deploy the full Slurm cluster (sackd, slurmctld, slurmd, slurmdbd,
  slurmrestd, mysql) and integrate all applications. Shared session state
  relied on by every subsequent feature.
scenarios:
  - |-
    Deploy the Slurm cluster

    Given I add model 'slurm'
    And I switch to model 'slurm'
    And I set 'update-status-hook-interval' for model 'slurm' to '10s'
    And I deploy 'sackd' from a local charm on base 'ubuntu@26.04' with name 'login'
    And I deploy 'slurmctld' from a local charm on base 'ubuntu@26.04' with name 'controller' with config 'slurm-conf-parameters=SlurmctldTimeout=10' with constraints 'virt-type=virtual-machine'
    And I deploy 'slurmd' from a local charm on base 'ubuntu@26.04' with name 'compute'
    And I deploy 'slurmdbd' from a local charm on base 'ubuntu@26.04' with name 'database'
    And I deploy 'slurmrestd' from a local charm on base 'ubuntu@26.04' with name 'rest-api'
    And I deploy 'mysql'
    And I integrate 'login' with 'controller'
    And I integrate 'compute' with 'controller'
    And I integrate 'database' with 'controller'
    And I integrate 'rest-api' with 'controller'
    And I integrate 'mysql' with 'database'
    Then the workload status for app 'login' is 'active'
    And the workload status for app 'controller' is 'active'
    And the workload status for app 'compute' is 'active'
    And the workload status for app 'database' is 'active'
    And the workload status for app 'rest-api' is 'active'

---
feature: "Slurm services health"
type: functional
status: implemented
risk: edge
description: |-
  Verify Slurm services are active within units, the prometheus-slurm-exporter
  metrics endpoint is accessible, and slurmctld/slurmdbd are listening on
  their expected ports.
background: |-
  Given 'login' is deployed
  And 'controller' is deployed
  And 'compute' is deployed
  And 'database' is deployed
  And 'rest-api' is deployed
scenarios:
  - |-
    Slurm services are active within all units

    Then the Slurm systemd service is active on all Slurm units
  - |-
    Slurm metrics endpoint is accessible

    Then the slurmctld metrics endpoint on unit 'controller/0' returns http status '200'
  - |-
    Slurmctld is listening on port 6817

    Then unit 'controller/0' is listening on TCP port '6817'
  - |-
    Slurmdbd is listening on port 6819

    Then unit 'database/0' is listening on TCP port '6819'

---
feature: "Slurm node operations"
type: functional
status: implemented
risk: edge
description: |-
  Compute node state, set-node-config, and set-node-state action verification.
background: |-
  Given 'controller' is deployed
  And 'compute' is deployed
scenarios:
  - |-
    Default slurmd node state and reason

    Then the slurmd node for unit 'compute/0' has state containing 'DOWN' and reason "'n/a'"
  - |-
    Set node config action updates node weight

    When I run action 'set-node-config' on unit 'compute/0' with parameters 'parameters=weight=100'
    Then the slurmd node for unit 'compute/0' has weight '100' and state containing 'DOWN' and reason "'n/a'"
    When I run action 'set-node-config' on unit 'compute/0' with parameters 'reset=true'
    Then the slurmd node for unit 'compute/0' has weight '1' and state containing 'DOWN' and reason "'n/a'"
  - |-
    Set node state action updates node state and reason

    When I run action 'set-node-state' on unit 'controller/0' with parameters 'nodes=compute-0 state=down reason=maintenance'
    Then the slurmd node for unit 'compute/0' has state containing 'DOWN' and reason "'maintenance'"
    When I run action 'set-node-state' on unit 'controller/0' with parameters 'nodes=compute-0 state=idle'
    Then the slurmd node for unit 'compute/0' has state containing 'IDLE' and reason ""

---
feature: "Slurm user authorization"
type: security
status: implemented
risk: edge
description: |-
  Unprivileged users may query the scheduler and mint JWT tokens for
  themselves but cannot administer the cluster, control its services,
  modify accounting, mint tokens for other users, or tamper with
  configuration and logs.
background: |-
  Given 'login' is deployed
  And 'controller' is deployed
  And 'compute' is deployed
  And 'database' is deployed
  And 'rest-api' is deployed
scenarios:
  - |-
    Unprivileged user can query the scheduler

    Then the command 'sinfo' on unit 'login/0' as user 'nobody' succeeds
  - |-
    Unprivileged user cannot reconfigure Slurm

    Then the command 'scontrol reconfigure' on unit 'login/0' as user 'nobody' is denied
    And the command 'scontrol create partitionname=authz-test nodes=compute-0' on unit 'login/0' as user 'nobody' is denied
    And the output of 'sinfo -h -o %P' on unit 'login/0' as user 'nobody' does not contain 'authz-test'
  - |-
    Unprivileged user cannot change node state

    Then the command 'scontrol update nodename=compute-0 state=drain reason=authz-test' on unit 'login/0' as user 'nobody' is denied
    And the output of 'sinfo -h -o %T -n compute-0' on unit 'login/0' as user 'nobody' contains 'idle'
  - |-
    Unprivileged user cannot control Slurm services

    Then the command 'systemctl restart slurmctld' on unit 'controller/0' as user 'nobody' is denied
    And the command 'systemctl is-active --quiet slurmctld' on unit 'controller/0' as user 'nobody' succeeds
    And the command 'systemctl stop slurmd' on unit 'compute/0' as user 'nobody' is denied
    And the command 'systemctl is-active --quiet slurmd' on unit 'compute/0' as user 'nobody' succeeds
  - |-
    Unprivileged user cannot tamper with Slurm configuration or logs

    Then the command 'echo tampered >> /etc/slurm/slurm.conf' on unit 'controller/0' as user 'nobody' is denied
    And the command 'grep -c tampered /etc/slurm/slurm.conf | grep -x 0' on unit 'controller/0' as user 'nobody' succeeds
    And the command 'echo tampered >> /var/log/slurm/slurmctld.log' on unit 'controller/0' as user 'nobody' is denied
  - |-
    Unprivileged user cannot modify accounting

    Then the command 'sacctmgr -i delete account nonexistent-authz-test' on unit 'login/0' as user 'nobody' is denied
    And the command 'sacctmgr -i add qos authz-test' on unit 'login/0' as user 'nobody' is denied
  - |-
    Unprivileged user can mint a jwt token for themselves

    Then the command 'scontrol token' on unit 'login/0' as user 'nobody' succeeds
  - |-
    Unprivileged user cannot mint jwt tokens for other users

    Then the command 'scontrol token username=root' on unit 'login/0' as user 'nobody' is denied
  - |-
    Unprivileged user cannot cancel another user's job

    Given a Slurm job is submitted from unit 'login/0' as user 'ubuntu'
    Then the submitted job cannot be cancelled by user 'nobody' from unit 'login/0'
    And the submitted job is still running
  - |-
    Unprivileged user cannot run a job as another user

    Then the command 'sbatch --uid=0 --chdir=/tmp --wrap="id -un"' on unit 'login/0' as user 'nobody' is denied
    And a job run from unit 'login/0' as user 'nobody' executes as that user
  - |-
    Unauthenticated slurmrestd request is denied

    Then an unauthenticated request to the slurmrestd API from unit 'rest-api/0' is rejected with status '401'

---
feature: "Slurm secret and credential protection"
type: security
status: implemented
risk: edge
description: |-
  Slurm secret files are owner-only with the correct per-charm service
  owner and are unreadable by unprivileged users. The accounting database
  password stays confined to its 0600 slurmdbd.conf file.
background: |-
  Given 'login' is deployed
  And 'controller' is deployed
  And 'compute' is deployed
  And 'database' is deployed
  And 'rest-api' is deployed
scenarios:
  - |-
    Auth key file is owner-only with the correct owner on every Slurm unit

    Then the file '/etc/slurm/slurm.jwks' on unit 'login/0' has mode '600' and owner 'slurm'
    And the file '/etc/slurm/slurm.jwks' on unit 'controller/0' has mode '600' and owner 'slurm'
    And the file '/etc/slurm/slurm.jwks' on unit 'database/0' has mode '600' and owner 'slurm'
    And the file '/etc/slurm/slurm.jwks' on unit 'compute/0' has mode '600' and owner 'root'
    And the file '/etc/slurm/slurm.jwks' on unit 'rest-api/0' has mode '600' and owner 'slurmrestd'
  - |-
    JWT signing key file is owner-only where it exists

    Then the file '/etc/slurm/jwt_hs256.key' on unit 'controller/0' has mode '600' and owner 'slurm'
    And the file '/etc/slurm/jwt_hs256.key' on unit 'database/0' has mode '600' and owner 'slurm'
  - |-
    Unprivileged user cannot read Slurm key material

    Then the command 'cat /etc/slurm/slurm.jwks' on unit 'controller/0' as user 'nobody' is denied
    And the command 'cat /etc/slurm/jwt_hs256.key' on unit 'controller/0' as user 'nobody' is denied
  - |-
    Database password file is owner-only and unreadable by unprivileged users

    Then the file '/etc/slurm/slurmdbd.conf' on unit 'database/0' has mode '600' and owner 'slurm'
    And the command 'cat /etc/slurm/slurmdbd.conf' on unit 'database/0' as user 'nobody' is denied

---
feature: "Slurm key rotation"
type: functional
status: implemented
risk: edge
description: |-
  rotate-auth-key and rotate-jwt-key action verification, including
  cross-unit key propagation and REST API token invalidation.
background: |-
  Given 'login' is deployed
  And 'controller' is deployed
  And 'compute' is deployed
  And 'database' is deployed
  And 'rest-api' is deployed
scenarios:
  - |-
    Rotate auth key across the cluster

    Given I capture the Slurm auth JWKS key from unit 'controller/0'
    When I run action 'rotate-auth-key' on unit 'controller/0' with an extended timeout
    Then the workload status for app 'login' is 'active'
    And the workload status for app 'controller' is 'active'
    And the workload status for app 'compute' is 'active'
    And the workload status for app 'database' is 'active'
    And the workload status for app 'rest-api' is 'active'
    And the Slurm auth JWKS key on unit 'controller/0' is rotated and propagated to all units
  - |-
    Rotate JWT key across the cluster

    Given I capture the Slurm JWT signing key from unit 'controller/0'
    And I capture the Slurm JWT signing key from unit 'database/0'
    And the initial Slurm JWT signing keys match between 'controller/0' and 'database/0'
    And I capture an initial Slurm JWT token from unit 'controller/0'
    And the slurmrestd diagnostic endpoints are reachable from 'controller/0'
    When I run action 'rotate-jwt-key' on unit 'controller/0' with an extended timeout
    Then the workload status for app 'login' is 'active'
    And the workload status for app 'controller' is 'active'
    And the workload status for app 'compute' is 'active'
    And the workload status for app 'database' is 'active'
    And the workload status for app 'rest-api' is 'active'
    And the Slurm JWT signing key on unit 'controller/0' is rotated and matches unit 'database/0'
    And the initial Slurm JWT token from unit 'controller/0' is no longer valid
    And a new Slurm JWT token from unit 'controller/0' is valid for all slurmrestd diagnostic endpoints

