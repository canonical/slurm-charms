# gherkinator test plan for the Slurm charms BDD migration.
#
# This file is the SINGLE SOURCE OF TRUTH for every BDD scenario in this
# repo. Edit it with `gherkinator edit`, validate with `gherkinator
# validate`, and regenerate the .feature files with:
#
#   gherkinator generate --format gh tests/integration/plans/edge.yaml \
#     --output-dir tests/integration/features
#
# Do NOT hand-edit the generated .feature files — they are overwritten on
# every `gherkinator generate`.
#
# Step definitions live in tests/integration/test_*.py. Cross-file ordering
# is preserved via @pytest.mark.order on each scenario-loading module. The
# `type`/`status`/`risk` fields become Gherkin tags via gherkinator.

---
feature: "Slurm cluster deployment"
type: functional
status: implemented
risk: edge
description: "Deploy the full Slurm cluster (sackd, slurmctld, slurmd, slurmdbd, slurmrestd, mysql) and integrate all applications. Shared session state relied on by every subsequent feature."
scenarios:
  - |-
    Deploy the slurm cluster
    Given I add model 'slurm'
    And I switch to model 'slurm'
    And I deploy the slurm reference cluster
    And I integrate 'login' with 'controller'
    And I integrate 'compute' with 'controller'
    And I integrate 'database' with 'controller'
    And I integrate 'rest-api' with 'controller'
    And I integrate 'mysql' with 'database'
    Then the workload status for app 'login' is 'active'
    And the workload status for app 'controller' is 'active'
    And the workload status for app 'compute' is 'active'
    And the workload status for app 'database' is 'active'
    And the workload status for app 'rest-api' is 'active'

---
feature: "Slurm services health"
type: functional
status: implemented
risk: edge
description: "Verify Slurm services are active within units, the prometheus-slurm-exporter metrics endpoint is accessible, and slurmctld/slurmdbd are listening on their expected ports."
background: |-
  Given 'login' is deployed
  And 'controller' is deployed
  And 'compute' is deployed
  And 'database' is deployed
  And 'rest-api' is deployed
scenarios:
  - |-
    Slurm services are active within all units
    Then the slurm systemd service is active on all slurm units
  - |-
    Slurm metrics endpoint is accessible
    Then the slurmctld metrics endpoint on unit 'controller/0' returns http status '200'
  - |-
    Slurmctld is listening on port 6817
    Then unit 'controller/0' is listening on TCP port '6817'
  - |-
    Slurmdbd is listening on port 6819
    Then unit 'database/0' is listening on TCP port '6819'

---
feature: "Slurm node operations"
type: functional
status: implemented
risk: edge
description: "Compute node state, set-node-config, and set-node-state action verification."
background: |-
  Given 'controller' is deployed
  And 'compute' is deployed
scenarios:
  - |-
    Default slurmd node state and reason
    Then the slurmd node for unit 'compute/0' has state containing 'DOWN' and reason "'n/a'"
  - |-
    Set node config action updates node weight
    When I run action 'set-node-config' on unit 'compute/0' with parameters 'parameters=weight=100'
    Then the slurmd node for unit 'compute/0' has weight '100' and state containing 'DOWN' and reason "'n/a'"
    When I run action 'set-node-config' on unit 'compute/0' with parameters 'reset=true'
    Then the slurmd node for unit 'compute/0' has weight '1' and state containing 'DOWN' and reason "'n/a'"
  - |-
    Set node state action updates node state and reason
    When I run action 'set-node-state' on unit 'controller/0' with parameters 'nodes=compute-0 state=down reason=maintenance'
    Then the slurmd node for unit 'compute/0' has state containing 'DOWN' and reason "'maintenance'"
    When I run action 'set-node-state' on unit 'controller/0' with parameters 'nodes=compute-0 state=idle'
    Then the slurmd node for unit 'compute/0' has state containing 'IDLE' and reason ""

---
feature: "Slurm key rotation"
type: functional
status: implemented
risk: edge
description: "rotate-auth-key and rotate-jwt-key action verification, including cross-unit key propagation and REST API token invalidation."
scenarios:
  - |-
    Rotate auth key across the cluster
    Given I capture the slurm auth JWKS key from unit 'controller/0'
    When I run action 'rotate-auth-key' on unit 'controller/0' with an extended timeout
    Then the workload status for app 'login' is 'active'
    And the workload status for app 'controller' is 'active'
    And the workload status for app 'compute' is 'active'
    And the workload status for app 'database' is 'active'
    And the workload status for app 'rest-api' is 'active'
    And the slurm auth JWKS key on unit 'controller/0' is rotated and propagated to all units
  - |-
    Rotate JWT key across the cluster
    Given I capture the slurm JWT signing key from unit 'controller/0'
    And I capture the slurm JWT signing key from unit 'database/0'
    And the initial slurm JWT signing keys match between 'controller/0' and 'database/0'
    And I capture an initial slurm JWT token from unit 'controller/0'
    And the slurmrestd diagnostic endpoints are reachable from 'controller/0'
    When I run action 'rotate-jwt-key' on unit 'controller/0' with an extended timeout
    Then the workload status for app 'login' is 'active'
    And the workload status for app 'controller' is 'active'
    And the workload status for app 'compute' is 'active'
    And the workload status for app 'database' is 'active'
    And the workload status for app 'rest-api' is 'active'
    And the slurm JWT signing key on unit 'controller/0' is rotated and matches unit 'database/0'
    And the initial slurm JWT token from unit 'controller/0' is no longer valid
    And a new slurm JWT token from unit 'controller/0' is valid for all slurmrestd diagnostic endpoints

---
feature: "Slurm job submission"
type: functional
status: implemented
risk: edge
description: "Basic job submission and GPU job submission with a mock GPU device."
background: |-
  Given 'login' is deployed
  And 'controller' is deployed
  And 'compute' is deployed
scenarios:
  - |-
    Simple job submission
    Then a slurm srun job submitted from unit 'login/0' runs on unit 'compute/0'
  - |-
    GPU job submission with mock GPU
    Given I set up a mock NVIDIA GPU device on unit 'compute/0'
    And I set 'cgroup-parameters' for app 'controller' to 'constraindevices=no'
    When I run action 'set-node-config' on unit 'compute/0' with parameters 'parameters=gres=gpu:mock_gpu:1'
    And I re-register the slurmd node 'compute-0' with the slurm controller on unit 'login/0'
    Then a slurm srun GPU job requesting 1 GPU submitted from unit 'login/0' runs on unit 'compute/0'

---
feature: "Slurm mail notifications"
type: functional
status: implemented
risk: edge
description: "SMTP integrator deployment and Slurm job notification emails for job end, failure, and begin with a custom signature."
background: |-
  Given 'controller' is deployed
scenarios:
  - |-
    Deploy and integrate SMTP integrator
    Given I deploy 'smtp-integrator' with auto-resolved local host and port '8025'
    And I integrate 'controller' with 'smtp-integrator:smtp'
    Then the workload status for app 'controller' is 'active'
    And the workload status for app 'smtp-integrator' is 'active'
  - |-
    Notification email when a job ends
    When I execute 'srun --time=1 --partition compute --mail-user=user@localhost --mail-type=END sleep 1' on unit 'login/0'
    Then a notification email is received by 'user@localhost' with subject matching '^Job charmed-hpc-[\w-]{4}\.\d+: Ended$' and content matching 'Your job \d+ has ended on charmed-hpc-[\w-]{4}\.'
  - |-
    Notification email when a job fails
    When I run a failing slurm srun job on unit 'login/0' with mail user 'anotheruser@localhost' and mail type 'FAIL,END'
    Then a notification email is received by 'anotheruser@localhost' with subject matching '^Job charmed-hpc-[\w-]{4}\.\d+: Failed$' and content matching 'Your job \d+ has failed on charmed-hpc-[\w-]{4}\.'
  - |-
    Notification email with custom signature when a job begins
    Given I set 'email-from-name' for app 'controller' to 'Integration Test Suite'
    When I execute 'srun --time=1 --partition compute --mail-user=furtheruser@localhost --mail-type=BEGIN sleep 1' on unit 'login/0'
    Then a notification email is received by 'furtheruser@localhost' with subject matching '^Job charmed-hpc-[\w-]{4}\.\d+: Began$' and content matching 'Your job \d+ has started on charmed-hpc-[\w-]{4}\..*?Regards,.*?Integration Test Suite'
  - |-
    Remove SMTP integrator
    When I remove app 'smtp-integrator'
    Then the workload status for app 'controller' is 'active'

