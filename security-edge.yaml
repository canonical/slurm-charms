# MERGED — this staging document has been incorporated into the live test
# plan and is kept only for reference. It can be deleted.
#
# Live locations:
#   - Plan documents:  tests/integration/plans/edge.yaml
#                      ("Slurm user authorization",
#                       "Slurm secret and credential protection")
#   - Feature files:   tests/integration/features/slurm_user_authorization.feature
#                      tests/integration/features/slurm_secret_and_credential_protection.feature
#   - Step modules:    tests/integration/test_user_authorization.py   (order 7)
#                      tests/integration/test_secret_protection.py    (order 8)
#   - Shared steps:    tests/integration/conftest.py
#                      (unprivileged-user command/output probes)
#
# Both plans are `status: planned` and their modules carry a
# `pytest.mark.skip`, matching the repo convention for unverified plans
# (see the InfluxDB feature). Remove the skip markers and flip the plan
# status to `implemented` once the scenarios are green against a live
# deployment.
#
# Design notes that shaped the final scenarios:
#
# - No When/Then interleaving. Per the bdd-test-author skill, assertions
#   that require running a command fold the execution into the Then step
#   itself (e.g. `Then the command '...' on unit '...' as user 'nobody'
#   is denied`), rather than alternating When/Then pairs.
#
# - Slurm CLI probes run on the login node. sackd brokers credentials for
#   unprivileged users there; on other units an unprivileged user cannot
#   even acquire a credential (the JWKS key is mode 0600), so a denial
#   would prove file permissions, not scheduler authorization.
#
# - `the command ... is denied` never asserts on exit code alone. It
#   requires a recognizable permission-style message and explicitly
#   rejects vacuous failures ("command not found", "no such file or
#   directory", "usage:"), failing loudly with the observed output.
#
# - JWT token scenarios test the real authz boundary: any user may mint a
#   token for themselves (`scontrol token` succeeds), but minting one for
#   another user (`scontrol token username=root`) is denied.
#
# - slurm.conf is mode 0644 by design, so the credential check is
#   inverted: an unprivileged read must succeed AND the output must not
#   contain StoragePass/StorageUser. Read-denial lives on slurmdbd.conf
#   (mode 0600, holds StoragePass) instead.
#
# - Key file owners differ per charm (slurm / root on slurmd / slurmrestd
#   per internal/slurm-ops constants), so ownership is asserted per unit
#   rather than with a single expected owner.
#
# First-run watchlist (each fails loudly rather than passing silently):
#   - Exact denial wording varies by Slurm version; extend
#     _DENIAL_PATTERNS in conftest.py from the observed output.
#   - /var/log/slurm/slurmctld.log path and sacctmgr presence on the
#     login node are standard but unverified on this image.
#   - systemctl denials assume polkit is present on the units.
